# Reverse proxy for the bug report server. TLS certificates via certbot:
#   sudo certbot --nginx -d bug.tribaltrouble.org
server {
    listen 80;
    server_name bug.tribaltrouble.org;

    # Must be at least BugReportProtocol.MAX_REQUEST_BYTES (48 MB).
    client_max_body_size 49m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }
}
