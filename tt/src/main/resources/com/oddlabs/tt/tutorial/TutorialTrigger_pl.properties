army_menu=Wr\u00F3\u0107 do menu g\u0142\u00F3wnego zbrojowni, klikaj\u0105c ikon\u0119 Wstecz (lub naciskaj\u0105c Esc). Aby wyposa\u017Cy\u0107 armi\u0119 w nowo wyprodukowan\u0105 bro\u0144, kliknij ikon\u0119 Rozmieszczenia Armii (lub naci\u015Bnij A).
army=Dla ka\u017Cdego typu broni mo\u017Cesz wyszkoli\u0107 odpowiedni typ wojownika. U\u017Cyj ma\u0142ych ikon + i -, aby ustawi\u0107 liczb\u0119 wojownik\u00F3w. Spr\u00F3buj wyszkoli\u0107 armi\u0119 {0} wojownik\u00F3w skalnych.
attack_tower=Twoja wie\u017Ca jest teraz atakowana przez ma\u0142\u0105 grup\u0119 wiking\u00F3w. Wojownik w wie\u017Cy automatycznie atakuje wszystkich wrog\u00F3w w zasi\u0119gu, wi\u0119c odchyl si\u0119 do ty\u0142u i ciesz si\u0119 widokiem rzezi wiking\u00F3w.
building_chieftain=Zbuduj kwater\u0119 i przenie\u015B do niej swoich ludzi. Im wi\u0119cej jednostek masz w kwaterze, tym szybciej wyszkolisz wodza. Wybierz kwater\u0119 i kliknij ikon\u0119 \u201ESzkolenie wodza\u201D (lub naci\u015Bnij C).
build_menu=Wr\u00F3\u0107 do menu g\u0142\u00F3wnego zbrojowni, klikaj\u0105c ikon\u0119 Wstecz na dole (lub naci\u015Bnij Esc). Aby wyprodukowa\u0107 bro\u0144, wybierz kilku swoich ludzi, przenie\u015B ich do zbrojowni i kliknij ikon\u0119 \u201EProdukcja broni\u201D znajduj\u0105c\u0105 si\u0119 pod ikon\u0105 \u201EZbieranie zasob\u00F3w\u201D (lub naci\u015Bnij W).
chieftain_built=Nale\u017Cy pami\u0119ta\u0107, \u017Ce podczas szkolenia wodza kwatery nie generuj\u0105 nowych jednostek. Mo\u017Cesz przerwa\u0107 szkolenie wodza, klikaj\u0105c ponownie ikon\u0119 \u201ESzkolenie wodza\u201D (lub naciskaj\u0105c klawisz C). Ponowne klikni\u0119cie rozpocznie szkolenie nowego wodza od podstaw.
empty_tower=Je\u015Bli potrzebujesz wojownika gdzie indziej lub wie\u017Ca ma zosta\u0107 zniszczona, mo\u017Cesz go usun\u0105\u0107 z wie\u017Cy. Aby usun\u0105\u0107 wojownika, wybierz wie\u017C\u0119 i kliknij ikon\u0119 wyj\u015Bcia (lub naci\u015Bnij X).
from_map_mode=W trybie mapy Twoje jednostki i budynki s\u0105 pod\u015Bwietlone kolorem gracza. Kliknij dowolne miejsce na mapie, aby powi\u0119kszy\u0107 dany punkt, lub naci\u015Bnij spacj\u0119 lub 5 na klawiaturze numerycznej, aby powr\u00F3ci\u0107 do poprzedniego widoku.
harvest_menu=Zapasy, jednostki i bro\u0144 w Twoim arsenale s\u0105 widoczne u g\u00F3ry. Aby zebra\u0107 zasoby do budowy broni, kliknij ikon\u0119 \u201EZbierz zasoby\u201D (lub naci\u015Bnij G).
magic=W\u00F3dz dysponuje dwoma specjalnymi atakami magicznymi, kt\u00F3re wymagaj\u0105 czasu na na\u0142adowanie, zanim b\u0119d\u0105 gotowe do u\u017Cycia. Wybierz swojego wodza i wypr\u00F3buj oba ataki po kolei, klikaj\u0105c ich ikony (lub naciskaj\u0105c S lub C), gdy stan\u0105 si\u0119 dost\u0119pne.
map_mode=Naci\u015Bnij spacj\u0119 lub 5 na klawiaturze numerycznej, aby wej\u015B\u0107 w tryb mapy.
move_unit=Przenie\u015B wybrane jednostki, korzystaj\u0105c z ikony Przenie\u015B (M) lub klikaj\u0105c prawym przyciskiem myszy na mapie (Ctrl-klikni\u0119cie w systemie Mac OS X).
pitch=Mo\u017Cesz przegl\u0105da\u0107 w g\u00F3r\u0119 i w d\u00F3\u0142 za pomoc\u0105 klawiszy 2 i 8 na klawiaturze numerycznej lub klawiszy Home i End.
placing=Rozpoczynasz gr\u0119 z ma\u0142\u0105 grup\u0105 ch\u0142op\u00F3w, najprostsz\u0105 jednostk\u0105. Pieonie mog\u0105 budowa\u0107 i naprawia\u0107 budynki oraz zbiera\u0107 surowce. Wybierz swoich ch\u0142op\u00F3w i kliknij ikon\u0119 kwater (lub naci\u015Bnij Q).
quarters=Zielone kwadraty wskazuj\u0105 potencjalne miejsca budowy. Najed\u017A kursorem myszy na jedno z nich i kliknij, aby zbudowa\u0107 budynek.
rally_point=Mo\u017Cesz wskaza\u0107 miejsce zbi\u00F3rki, w kt\u00F3rym Twoi podopieczni powinni si\u0119 zebra\u0107 po opuszczeniu kwatery, ustawiaj\u0105c punkt zborny. Wybierz swoj\u0105 kwater\u0119, kliknij ikon\u0119 Punktu Zbornego (lub naci\u015Bnij R) i kliknij w dowolnym miejscu na wyspie, aby umie\u015Bci\u0107 punkt zborny.
repair=Podczas ataku Twoja wie\u017Ca zosta\u0142a lekko uszkodzona. Mo\u017Cesz sprawdzi\u0107 stan budynku, naje\u017Cd\u017Caj\u0105c na niego kursorem myszy. Napraw budynek, wybieraj\u0105c kilku ludzi, klikaj\u0105c ikon\u0119 naprawy (lub naciskaj\u0105c klawisz G) i klikaj\u0105c na budynek. Napraw teraz swoj\u0105 wie\u017C\u0119.
rotate=Obr\u00F3\u0107 widok za pomoc\u0105 klawiszy 4 i 6 na klawiaturze numerycznej lub klawiszy Insert i Delete.
scroll=Mo\u017Cesz przesuwa\u0107 map\u0119, przesuwaj\u0105c wska\u017Anik myszy do kraw\u0119dzi ekranu lub u\u017Cywaj\u0105c klawiszy strza\u0142ek.
select_armory=Wybierz swoich ludzi i kliknij ikon\u0119 Zbrojowni (lub naci\u015Bnij R), aby zbudowa\u0107 zbrojowni\u0119. Po uko\u0144czeniu budowy, Twoi ludzie automatycznie wejd\u0105 do \u015Brodka. Kliknij budynek, aby go wybra\u0107.
select_quarters=Najed\u017A kursorem myszy na plac budowy, aby monitorowa\u0107 post\u0119py. U\u017Cyj + i - na klawiaturze numerycznej, aby dostosowa\u0107 pr\u0119dko\u015B\u0107 gry. Po uko\u0144czeniu budowy, wybierz j\u0105, klikaj\u0105c na ni\u0105. Jasnozielony okr\u0105g wska\u017Ce, \u017Ce zosta\u0142a wybrana.
select_unit=Wybierz jednostk\u0119, klikaj\u0105c j\u0105. Aby wybra\u0107 wiele jednostek, przytrzymaj klawisz Shift i kliknij wi\u0119cej jednostek lub przeci\u0105gnij pole wyboru wok\u00F3\u0142 jednostek, kt\u00F3re chcesz zaznaczy\u0107. Mo\u017Cesz r\u00F3wnie\u017C zaznaczy\u0107 wszystkie jednostki tego samego typu w widoku, klikaj\u0105c dwukrotnie jedn\u0105 z nich. Wybrane jednostki s\u0105 oznaczone jasnozielonym k\u00F3\u0142kiem.
supply=Dla ka\u017Cdego rodzaju zasobu mo\u017Cesz klikn\u0105\u0107 ma\u0142\u0105 ikon\u0119 +, aby przypisa\u0107 robotnik\u00F3w do zbierania tego rodzaju zasobu. Robotnicy b\u0119d\u0105 to robi\u0107, dop\u00F3ki ich nie wybierzesz i nie wydasz im innych polece\u0144. Staraj si\u0119 zbiera\u0107 {0} drewna i {1} ska\u0142.
tutorial_over=Zbuduj kwatery i zbrojowni\u0119, zbierz zasoby, wyprodukuj bro\u0144 i rozmie\u015B\u0107 armi\u0119. Wybierz swoj\u0105 armi\u0119, kliknij ikon\u0119 ataku (lub naci\u015Bnij A), przewi\u0144 na drug\u0105 stron\u0119 wyspy i kliknij na wrogich plemionach i budynkach lub w ich pobli\u017Cu. Zniszcz wszystkie wrogie jednostki i budynki!
unit_count=G\u0142\u00F3wn\u0105 funkcj\u0105 kwater jest produkowanie nowych robotnik\u00F3w. Im wi\u0119cej robotnik\u00F3w masz w budynku, tym szybciej b\u0119dzie on produkowa\u0142 nowych robotnik\u00F3w. Wybierz budynek i kliknij ma\u0142\u0105 ikon\u0119 +, aby przenie\u015B\u0107 robotnik\u00F3w z kwater. Postaraj si\u0119 przenie\u015B\u0107 co najmniej {0} robotnik\u00F3w poza kwater\u0119.
unit_in_tower=Jednostka wojownika w wie\u017Cy otrzymuje premi\u0119 do ataku i nie mo\u017Ce zosta\u0107 zabita, dop\u00F3ki wie\u017Ca nie zostanie zniszczona. Mo\u017Cesz umie\u015Bci\u0107 wojownika w wie\u017Cy, klikaj\u0105c j\u0105 prawym przyciskiem myszy, gdy masz wybran\u0105 jednostk\u0119 wojownika. Umie\u015B\u0107 swojego wojownika w wie\u017Cy.
units_in_quarters=Wybierz swoich ludzi i przenie\u015B ich do kwater, klikaj\u0105c ikon\u0119 Przenie\u015B (lub naciskaj\u0105c klawisz M), a nast\u0119pnie klikaj\u0105c \u0107wiartki, lub po prostu klikaj\u0105c \u0107wiartki prawym przyciskiem myszy (Ctrl+klikni\u0119cie w systemie Mac OS X).
weapon=Dla ka\u017Cdego dost\u0119pnego rodzaju broni u\u017Cyj ma\u0142ych ikon + i -, aby ustawi\u0107 liczb\u0119 broni, kt\u00F3r\u0105 chcesz, aby twoi robotnicy produkowali (najed\u017A kursorem myszy na ikony, aby zobaczy\u0107, jakie zasoby s\u0105 potrzebne). Im wi\u0119cej robotnik\u00F3w masz w budynku, tym szybciej b\u0119d\u0105 produkowa\u0107 bro\u0144. Postaraj si\u0119 produkowa\u0107 {0} broni kamiennej.
zoom=Powi\u0119kszaj i pomniejszaj, obracaj\u0105c k\u00F3\u0142ko myszy lub u\u017Cywaj\u0105c klawiszy Page Up i Page Down. Mo\u017Cesz te\u017C przytrzyma\u0107 klawisz Z i porusza\u0107 myszk\u0105 w g\u00F3r\u0119 i w d\u00F3\u0142.
select_tower=Wybierz swoich ludzi, kliknij \u201EWie\u017Ca\u201D (lub naci\u015Bnij T) i znajd\u017A odpowiednie miejsce do zbudowania wie\u017Cy. Po zbudowaniu wie\u017Cy wybierz j\u0105.
fpc=Przytrzymuj\u0105c klawisz F lub \u015Brodkowy przycisk myszy, mo\u017Cesz zmieni\u0107 kierunek kamery, poruszaj\u0105c mysz\u0105.
