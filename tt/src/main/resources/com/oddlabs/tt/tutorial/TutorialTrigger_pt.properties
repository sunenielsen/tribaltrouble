army_menu=Volte para o menu principal da armaria clicando no icone de Voltar (ou pressionando Esc). Para equipar um exército com suas armas recém produzidas, clique no ícone de Mobilizar Exército (ou pressione A).
army=Para cada tipo de arma, você pode treinar um guerreiro correspondente. use os pequenos ícones de + e - para ajustar quantos guerreiros você quer. tente treinar um exército de {0} guerreiros de pedra.
attack_tower=Sua torre agora está sendo atacada por um pequeno grupo de guerreiros viking. Um guerreiro em cima da torre ataca todos os inimigos automaticamente dentro de seu alcance, então se acomode e divirta-se vendo os Vikings sendo massacrados.
building_chieftain=Construa os alojamentos e mova seus peões dentro. Quanto mais unidades você tem dentro dos alojamentos, mais rápido você pode treinar um chefe. Selecione os alojamentos e clique no icone de Treinar Chefe (ou pressione C).
build_menu=Volte para o menu principal da armaria clicando no icone de Voltar (ou pressione Esc). Para produzir algumas armas, selecione alguns de seus peões, movimente eles para dentro da armaria e clique no ícone de Produzir Armas localizado abaixo do ícone de Coletar Recursos (ou pressione W).
chieftain_built=Perceba que enquanto o chefe está sendo treinado, os alojamentos não geram novas unidades. Você pode abortar o treinamento do chefe clicando no ícone de Treinar Chefe novamente (ou pressionando C). Clicar novamente vai começar a treinar um novo chefe do início.
empty_tower=Se você precisa do guerreiro em outro lugar ou a torre está prestes a ser destruída, você pode removê-lo da torre. Remova seu guerreiro selecionando a torre e clicando no ícone de Sair (ou pressionando X).
from_map_mode=No Modo Mapa, suas unidades e edifícios são marcadas com a sua cor de jogador. Clique em algum canto do mapa para aproximar nesse local ou pressione espaço ou teclado numérico 5 para retornar à visão anterior.
harvest_menu=O inventário de recursos, unidades e armas da sua armaria é mostrado no topo. Para coletar alguns recursos para produzir armas, clique no ícone de Coletar Recursos (ou pressione G).
magic=O chefe possui dois ataques mágicos especiais, e ambos requerem um pouco de tempo para carregarem antes de serem utilizados. Selecione seu chefe e tente ambos ataques alternadamente clicando nos seus ícones (ou pressionando S ou C) quando eles ficarem disponíveis.
map_mode=Pressione espaço ou teclado numérico para entrar no Modo Mapa.
move_unit=Movimente as unidades selecionadas usando o ícone de Mover (M) ou clicando com o botão direito no mapa (Ctrl + clique no Mac OS X).
pitch=Olhe para cima e para baixo usando o 2 e 8 no teclado numérico ou Home e End.
placing=Você começa a partida com um pequeno grupo de peões, a unidade mais básica. Peões podem construir e reparar edifícios e coletar recursos. Selecione seus peões e clique no ícone dos Alojamentos (ou pressione Q).
quarters=O quadrado verde indica locais possíveis para a construção. Passe o ponteiro do mouse sobre um deles, e clique para construir o edifício.
rally_point=Você pode direcionar onde seus peões deverão se reúnir quando saírem dos alojamentos ao colocar um ponto de encontro. Selecione seus alojamentos, clique no ícone de Ponto de Encontro (ou pressione R) e clique em algum lugar na ilha para posicionar o ponto de encontro.
repair=Enquanto estava sendo atacada, sua torre ficou levemente danificada. Você pode ver o estado de um edifício passando o ponteiro do mouse sobre ele. Repare um edifício selecionando alguns peões, clicando no ícone de Reparar (ou pressionando G) e clique no edifício. Repare sua torre agora.
rotate=Gire a visão usando 4 e 6 no teclado numérico ou Insert e Delete.
scroll=Faça uma panorâmica pelo mapa movendo o ponteiro do mouse na ponta da tela ou usando as teclas de seta.
select_armory=Selecione seus peões e clique no ícone de Armaria (ou pressione R) para construir uma armaria. Quando o edifício estiver concluído, seus peões vão entrar dentro automaticamente. clique no edifício para selecioná-lo.
select_quarters=Passe com o ponteiro do mouse sobre um edifício em construção para monitorar o progresso. Use + e - no teclado numérico para ajustar a velocidade da partida. Quando o edifício for concluído, selecione-o clicando nele. Um brilhante círculo verde vai indicar quanto ele estiver selecionado.
select_unit=Selecione uma unidade clicando nela. Selecione multiplas unidades segurando o shift enquanto clica em mais unidades ou arrastando uma caixa de seleção na unidades que deseja selecionar. Você também pode selecionar todas as unidades do mesmo tipo dentro da visão dando um clique duplo em uma delas. Unidades selecionadas são marcadas com um brilhante círculo verde.
supply=Para cada tipo de recurso, você pode clicar no pequeno ícone de + para atribuír peões para coletar aquele tipo de recurso. Os peões vão continuar à fazer isso até você selecioná-los e dar à eles ordens diferentes. Tente coletar {0} madeira e {1} recursos de pedra.
tutorial_over=Construa os alojamentos e uma armaria, colete recursos, produza algumas armas e mobilize um exército. Selecione seu exército, clique no ícone de Atacar (ou pressione A), movimente-se até o outro lado da ilha e clique no ou próximo dos membros da tribo e edifícios inimigos. Destrua todas as unidades e edifícios inimigos!
unit_count=A principal função dos alojamentos é produzir novos peões. Quanto mais peões você tiver em um edifício, mais rápido ele vai produzir mais peões. Selecione o edifício e clique no pequeno ícone de + para mover peões para fora dos alojamentos. Tente mover pelo menos {0} peões fora dos alojamentos.
unit_in_tower=Uma unidade guerreira na torre recebe um ataque bonus e não pode ser morta à menos que a torre seja destruída. Você pode posicionar um guerreiro em cima da torre dando um clique direito na torre enquanto você tiver uma unidade guerreira selecionada. Coloque seu guerreiro em cima da torre.
units_in_quarters=Selecione seus peões e movimente-os dentro dos alojamentos clicando no ícone de Mover (ou pressionando M) e então clicando nos alojamentos ou simplesmente dando um clique direito nos alojamentos (Ctrl + clique no Mac OS X).
weapon=Para cada tipo de arma disponível, use os pequenos ícones de + e - para ajustar quantas armas você quer que seus peões produzam (mova o ponteiro do mouse sobre os ícones para ver que recursos são requeridos). Quanto mais peões você tiver em um edifício, mais rápido eles vão produzir as armas. Tente produzir {0} armas de pedra.
zoom=Aproxime e distancie girando a roda do mouse ou usando Page Up e Page Down. Você também pode segurar Z e mover o mouse para cima e para baixo.
select_tower=Selecione seus peões, clique no ícone de Torre (ou pressione T) e encontre um local adequado para construir a sua torre. Quando sua torre estiver construida, selecione-a.
fpc=Enquanto segurar a tecla F ou o botão do meio do mouse, você pode alterar a direção da camera movendo o mouse.
