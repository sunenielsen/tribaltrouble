tip0=Atacar unidades inimigas de um terreno mais elevado vai dar aos seus guerreiros uma vantagem tática
tip1=Guarde uma seleção pressionando Ctrl + 0-9 e reselecione ela ao pressionar seu número
tip2=Dê um zoom para a seleção guardada ao apertar duas vezes o seu número designado
tip3=Selecione todas as unidades do mesmo tipo dentro da visão dando um clique duplo em uma delas
tip4=Aproxime e afaste a câmera ao rodar a roda do mouse ou usando Page Up e Page Down
tip5=Quanto mais unidades você tiver em uma armaria, mais rápido elas conseguem produzir armas
tip6=Quando atribuindo unidades, dê um clique direito no icone de + e - para alterar os números para 10 por vez.
tip7=Mova as unidades selecionadas para dentro de um edifício ao dar um clique direito no edifício.
tip8=Quanto mais unidades você tiver em um alojamento, mais rápido ele vai produzir mais peões
tip9=Quanto mais unidades você tiver em um alojamento, mais rápido ele vai produzir um chefe
tip10=Peões podem derrubar torres mais rápido que guerreiros
tip11=Mover unidades usando o comando de ataque no chão vai fazer com que elas ataquem unidades inimigas à vista
tip12=Pressione Espaço ou 5 no teclado numérico para entrar no Modo Mapa
tip13=Posicione o ponteiro do mouse sobre unidades e edifícios para monitorar seus status
tip14=Unidades e edifícios de membros de equipe são marcados com circulos azuis quando selecionados
tip15=Faça uma panorâmica pelo mapa ao mover o ponteiro do mouse para a ponta da tela ou ao usar as setas do teclado
tip16=Rotacione a visão usando 4 e 6 no teclado numérico ou Insert e Delete
tip17=Direcione onde suas unidades devem se agrupar quando sairem de um edifício usando um ponto de encontro
tip18=Olhe para cima e para baixo usando 2 e 8 no teclado numérico ou Home e End
tip19=Armas feitas da galinha tropical conseguem quicar e acertar vários inimigos
tip20=No Modo Mapa, suas unidades e edifícios são marcados com a sua cor de jogador
tip21=Dê um zoom em outra area da ilha rapidamente trocando pelo Modo Mapa e clicando em algum lugar do mapa
tip22=Selecione multiplas unidades segurando o shift enquanto clica em mais unidades
tip23=Selecione multiplas unidades arrastando uma caixa ao redor das unidades que você quer selecionar
tip24=Para construir novos edifícios rapidamente, utilize a função de transporte para enviar um grupo de peões carregados com madeira
tip25=As torres servem muito bem para defender construções, peões ou passagens estreitas
tip26=Construa alojamentos extras para ganhar novos peões mais rapidamente
tip27=Construir armarias perto de recursos valiosos vai permitir com que os peões peguem os recursos muito mais rápido
tip28=Para continuar produzindo um tipo de arma indefinidamente, aumente a produção até que um símbolo de infinito apareça
tip29=Mude a velocidade da partida pressionando + ou - no teclado numérico
tip30=Dentro de uma partida, pressione Enter para enviar mensagens para todos os jogadores e Shift + Enter para apenas os membros de equipe
tip31=Quando uma seta vermelha, verde ou azul piscarem, pressione Tab para pular para a área de interesse
tip32=Quando unidades forem atordoadas pelo Toque Aterrorizante, elas serão mais fáceis de atingir
tip33=O Rugido Devastador inflinge mais dano à distâncias próximas
tip34=Uma unidade fica sendo ferida pelo Ensopado Fedorento enquanto ela é engolida pela sua fumaça
tip35=Unidades aliadas estão acostumadas com o Ensopado Fedorento, então elas são mais resistentes
tip36=A Núvem Crepitante pode ser usada para ferir inimigos escondidos dentro de acampamentos fortificados
tip37=Utilize Ctrl + B e clique no chão para colocar uma marcação que alerta sua equipe
tip38=Precione N para alternar entre os peões ociosos
