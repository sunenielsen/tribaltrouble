welcome_message=Dzi\u0119kujemy za pobranie Tribal Trouble!\n\nJe\u015Bli posiadasz kod rejestracyjny, kliknij "Zarejestruj", aby pobra\u0107 pe\u0142n\u0105 wersj\u0119 Tribal Trouble.\n\nMo\u017Cesz te\u017C wypr\u00F3bowa\u0107 wersj\u0119 demo, ale z wy\u0142\u0105czonymi niekt\u00F3rymi funkcjami gry.\n\nNie zapomnij zaktualizowa\u0107 gry, aby uzyska\u0107 najnowsze funkcje i poprawki. Kliknij "Aktualizuj teraz" lub skorzystaj z opcji "Aktualizuj" w menu g\u0142\u00F3wnym.
