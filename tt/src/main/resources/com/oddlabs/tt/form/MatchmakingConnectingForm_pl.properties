connecting=\u0141\u0105czenie...
connection_failed=Nie uda\u0142o si\u0119 nawi\u0105za\u0107 po\u0142\u0105czenia z serwerem kojarzenia graczy. Upewnij si\u0119, \u017Ce masz po\u0142\u0105czenie z Internetem i \u017Ce gra jest w pe\u0142ni zaktualizowana.
username_error_too_many=B\u0141\u0104D: Tw\u00F3j klucz rejestracyjny jest ju\u017C u\u017Cywany na innym koncie.
user_error_invalid_email=B\u0141\u0104D: Nieprawid\u0142owy adres e-mail.
user_error_no_such_user=B\u0141\u0104D: U\u017Cytkownik nie istnieje lub has\u0142o jest nieprawid\u0142owe.
user_error_version_too_old=B\u0141\u0104D: Musisz zaktualizowa\u0107 swoj\u0105 wersj\u0119 gry \u201ETribal Trouble\u201D. Zaktualizuj gr\u0119 na platformie Steam lub pobierz najnowsz\u0105 wersj\u0119 ze strony https://tribaltrouble.org
username_error_already_exists=B\u0141\u0104D: U\u017Cytkownik o tej nazwie ju\u017C istnieje.
username_error_invalid_characters=B\u0141\u0104D: Nazwa u\u017Cytkownika zawiera niedozwolone znaki.
username_error_too_short=B\u0141\u0104D: Nazwa u\u017Cytkownika jest zbyt kr\u00F3tka.
username_error_too_long=B\u0141\u0104D: Nazwa u\u017Cytkownika jest zbyt d\u0142uga.
user_error_steam_required=B\u0141\u0104D: Ten serwer wymaga zalogowania si\u0119 do serwisu Steam. Uruchom gr\u0119 \u201ETribal Trouble\u201D za po\u015Brednictwem serwisu Steam, aby nawi\u0105za\u0107 po\u0142\u0105czenie.
