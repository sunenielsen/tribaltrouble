tip0=Atakowanie jednostek wroga z wy\u017Cej po\u0142o\u017Conego terenu zapewni twoim wojownikom przewag\u0119 taktyczn\u0105
tip1=Aby zapisa\u0107 wybrany element, naci\u015Bnij klawisze Ctrl + 0\u20139, a aby go ponownie zaznaczy\u0107, naci\u015Bnij odpowiedni\u0105 cyfr\u0119
tip2=Aby powi\u0119kszy\u0107 zapisany fragment, naci\u015Bnij dwukrotnie przycisk z odpowiednim numerem
tip3=Zaznacz wszystkie jednostki tego samego typu w widoku, klikaj\u0105c dwukrotnie jedn\u0105 z nich
tip4=Aby powi\u0119ksza\u0107 i pomniejsza\u0107, nale\u017Cy przewija\u0107 k\u00F3\u0142kiem myszy lub u\u017Cywa\u0107 klawiszy Page Up i Page Down
tip5=Im wi\u0119cej jednostek znajduje si\u0119 w zbrojowni, tym szybciej mog\u0105 one produkowa\u0107 bro\u0144
tip6=Podczas przypisywania jednostek kliknij prawym przyciskiem myszy ikony \u201E+\u201D i \u201E-\u201D, aby zmienia\u0107 warto\u015Bci o 10 naraz
tip7=Przenie\u015B zaznaczone jednostki do budynku, klikaj\u0105c prawym przyciskiem myszy na budynek
tip8=Im wi\u0119cej jednostek masz w kwaterach, tym szybciej b\u0119d\u0105 one wytwarza\u0107 kolejnych robotnik\u00F3w
tip9=Im wi\u0119cej jednostek masz w kwaterach, tym szybciej wyszkoli si\u0119 z nich w\u00F3dz
tip10=Robotnicy potrafi\u0105 burzy\u0107 wie\u017Ce szybciej ni\u017C wojownicy
tip11=Przemieszczanie jednostek poprzez atak na ziemi spowoduje, \u017Ce b\u0119d\u0105 one atakowa\u0107 wrogie jednostki, gdy tylko je dostrzeg\u0105
tip12=Naci\u015Bnij klawisz spacji lub cyfr\u0119 5 na klawiaturze numerycznej, aby przej\u015B\u0107 do trybu mapy
tip13=Najed\u017A kursorem myszy na jednostki i budynki, aby sprawdzi\u0107 ich stan
tip14=Jednostki i budynki cz\u0142onk\u00F3w dru\u017Cyny s\u0105 zaznaczane niebieskimi k\u00F3\u0142kami po ich wybraniu
tip15=Aby przesuwa\u0107 widok po mapie, przesu\u0144 wska\u017Anik myszy do kraw\u0119dzi ekranu lub u\u017Cyj klawiszy strza\u0142ek
tip16=Obr\u00F3\u0107 widok za pomoc\u0105 klawiszy 4 i 6 na klawiaturze numerycznej lub klawiszy Insert i Delete
tip17=Okre\u015Bl miejsce, w kt\u00F3rym Twoje jednostki powinny si\u0119 zgromadzi\u0107 po opuszczeniu budynku, wyznaczaj\u0105c punkt zbi\u00F3rki
tip18=Aby przewija\u0107 w g\u00F3r\u0119 i w d\u00F3\u0142, u\u017Cyj klawiszy 2 i 8 na klawiaturze numerycznej lub klawiszy Home i End
tip19=Bro\u0144 wykonana z kurczaka tropikalnego potrafi odbija\u0107 si\u0119 i trafia\u0107 wielu przeciwnik\u00F3w
tip20=W trybie mapy twoje jednostki i budynki s\u0105 pod\u015Bwietlone kolorem twojej postaci
tip21=Aby szybko przej\u015B\u0107 do innego obszaru wyspy, prze\u0142\u0105cz si\u0119 na tryb mapy i kliknij w dowolnym miejscu na mapie
tip22=Aby zaznaczy\u0107 wiele jednostek, przytrzymaj klawisz Shift i kliknij kolejne jednostki
tip23=Aby zaznaczy\u0107 wiele element\u00F3w, narysuj ramk\u0119 wok\u00F3\u0142 tych, kt\u00F3re chcesz zaznaczy\u0107
tip24=Aby szybko wznie\u015B\u0107 nowe budynki, skorzystaj z funkcji \u201ETransport\u201D, aby wys\u0142a\u0107 grup\u0119 robotnik\u00F3w z \u0142adunkiem drewna
tip25=Wie\u017Ce doskonale nadaj\u0105 si\u0119 do obrony budynk\u00F3w, robotnik\u00F3w lub w\u0105skich przej\u015B\u0107
tip26=Zbuduj dodatkowe kwatery, aby szybciej pozyskiwa\u0107 nowych robotnik\u00F3w
tip27=Budowa zbrojowni w pobli\u017Cu cennych zasob\u00F3w pozwoli robotnikom zbiera\u0107 je znacznie szybciej
tip28=Aby produkowa\u0107 dany rodzaj broni w niesko\u0144czono\u015B\u0107, zwi\u0119kszaj produkcj\u0119, a\u017C pojawi si\u0119 symbol niesko\u0144czono\u015Bci
tip29=Aby zmieni\u0107 pr\u0119dko\u015B\u0107 gry, naci\u015Bnij klawisz \u201E+\u201D lub \u201E-\u201D na klawiaturze numerycznej
tip30=Podczas gry naci\u015Bnij klawisz Enter, aby wys\u0142a\u0107 wiadomo\u015B\u0107 do wszystkich graczy, a Shift + Enter, aby wys\u0142a\u0107 wiadomo\u015B\u0107 do cz\u0142onk\u00F3w swojej dru\u017Cyny
tip31=Gdy miga czerwona, zielona lub niebieska strza\u0142ka, naci\u015Bnij klawisz Tab, aby przej\u015B\u0107 do interesuj\u0105cego Ci\u0119 obszaru
tip32=Gdy jednostki zostan\u0105 og\u0142uszone przez "Przera\u017Caj\u0105cy d\u017Awi\u0119k", \u0142atwiej jest je trafi\u0107
tip33="Niszczycielski ryk" zadaje wi\u0119ksze obra\u017Cenia z bliskiej odleg\u0142o\u015Bci
tip34=Jednostka ponosi obra\u017Cenia od "Cuchn\u0105cego gulaszu" tak d\u0142ugo, jak d\u0142ugo jest otoczona jego oparami
tip35=Jednostki sojusznicze s\u0105 przyzwyczajone do "Cuchn\u0105cego Gulaszu", wi\u0119c s\u0105 na niego bardziej odporne
tip36="Chmura Trzaskaj\u0105ca" mo\u017Ce s\u0142u\u017Cy\u0107 do zadawania obra\u017Ce\u0144 wrogom ukrywaj\u0105cym si\u0119 w ufortyfikowanych obozach
tip37=U\u017Cyj skr\u00F3tu klawiszowego Ctrl + B i kliknij na ziemi, aby ustawi\u0107 sygna\u0142 ostrzegawczy dla swojej dru\u017Cyny
tip38=Naci\u015Bnij klawisz N, aby prze\u0142\u0105cza\u0107 si\u0119 mi\u0119dzy bezczynnymi robotnikami
