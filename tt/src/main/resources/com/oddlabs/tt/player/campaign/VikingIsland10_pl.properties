header=Kogafutshlum
description=Ukryta wyspa, na kt\u00F3rej na szczycie g\u00F3ry rezyduje wielki b\u00F3g piorun\u00F3w Xarrr. Je\u015Bli dotrzemy na szczyt, mo\u017Cemy spe\u0142ni\u0107 \u017Cyczenie.
header0=W\u00F3dz Fjorleif
dialog0=To musi by\u0107 ta g\u00F3ra, o kt\u00F3rej wspomina\u0142 w\u00F3dz Mozumba. Musimy dotrze\u0107 na jej szczyt, ale nie jestem pewien, czy tubylcy pozwol\u0105 nam przej\u015B\u0107 bez walki. Mo\u017Ce znajdziemy inn\u0105 drog\u0119?
header1=W\u00F3dz Fjorleif
dialog1=W ko\u0144cu dotarli\u015Bmy na szczyt! Gdzie jest ten b\u00F3g piorun\u00F3w... Widz\u0119 tylko ma\u0142\u0105, brzydk\u0105 figurk\u0119!
header2=Xarrr Grzmot
dialog2=CO CI\u0118 SPROWADZA DO MOJEGO DOMU, \u015AMIERTELNIKU?
header3=W\u00F3dz Fjorleif
dialog3=Ojej, pos\u0105g m\u00F3wi! Erhm... och, Wielki Xarrr, w\u00F3dz Mozumba powiedzia\u0142 mi, \u017Ce je\u015Bli wspi\u0119liby\u015Bmy si\u0119 na twoj\u0105 g\u00F3r\u0119, m\u00F3g\u0142by\u015B by\u0107 tak mi\u0142y i udzieli\u0107 nam... eee...
header4=Xarrr Grzmot
dialog4=\u017Byczenie?
header5=W\u00F3dz Fjorleif
dialog5=*\u0142yk* Tak, o to chodzi\u0142o!
header6=Xarrr Grzmot
dialog6=No dobrze, czego sobie \u017Cyczysz, \u015Bmiertelniku?
header7=W\u00F3dz Fjorleif
dialog7=Uhm... Chcia\u0142bym, \u017Ceby moi wrogowie rozpadli si\u0119 przede mn\u0105!
header8=Xarrr Grzmot
dialog8=No dobrze, od teraz b\u0119dziesz m\u00F3g\u0142 u\u017Cywa\u0107 swojego luru, aby stworzy\u0107 Niszczycielski Ryk, kt\u00F3ry zmia\u017Cd\u017Cy wszystko w pobli\u017Cu!
header9=W\u00F3dz Fjorleif
dialog9=O, dzi\u0119kuj\u0119... chyba.
header10=Xarrr Grzmot
dialog10=A teraz, je\u015Bli pozwolicie... Musz\u0119 zaj\u0105\u0107 si\u0119 burz\u0105.
header11=W\u00F3dz Fjorleif
dialog11=Hmm... to mo\u017Ce wyja\u015Bnia\u0107 szalej\u0105c\u0105 burz\u0119, kt\u00F3ra nas tu w og\u00F3le sprowadzi\u0142a. No c\u00F3\u017C, lepiej wypr\u00F3bujmy ten nowy Niszczycielski Ryk, zanim ruszymy dalej. Zr\u00F3bmy tylko ma\u0142\u0105 demonstracj\u0119.
statue=Xarrr Grzmot
name2=Tubylcy
objective0=Dotrzyj na szczyt g\u00F3ry.
objective1=Wykonaj niszczycielski ryk ze szczytu g\u00F3ry.
