header=Dyngjaskagi
description=Gunnar mencionou algo sobre um grande e formidável deus do trovão ficando nessa ilha. Bem, não há como ele sequer ter a metade da força que O Poderoso Xarrr, mas ele ainda pode ser de ajuda com essa Núvem Crepitante que não funciona.
header0=Chefe Ngumba
dialog0=Esse é nosso destino - hora de um pequeno piquenique. Mas é melhor nos apressarmos, Eu acho que os Vikings também estão a caminho. Ah, não chegue muito perto dessas torres.
header1=Thor
dialog1=Quem ousa invadir minha peninsula?!?
header2=Chefe Ngumba
dialog2=Chefe Ngumba e seus valentes guerreiros!
header3=Thor
dialog3=Seu pequeno ácaro impertinente! Você vai se arrepender disso!
header4=Chefe Ngumba
dialog4=Ahhhhh, Grande Xarrr, proteja-nos!
header5=Thor
dialog5=Xarrr? Você conhece ele? Ele era um de meus antigos amigos da Academia de Deuses. Bom rapaz!
header6=Chefe Ngumba
dialog6=Ééé, claro. Ele me ensinou a controlar o clima pra que eu pudesse acertar meus inimigos com um furioso relampago. Porém de alguma forma não parece funcionar nesse clima frio.
header7=Thor
dialog7=Então ele deve ter te ensinado também como fazer aquele delicioso Ensopado Fedorento que ele cozinhava lá nos velhos tempos. Eu amo comida exótica, mas minha esposa sempre me serve o mesmo entediante porco picado com chouriço. Me faça um ensopado e eu vou ajudá-lo com seu problema do relampago!
header8=Chefe Ngumba
dialog8=Sem problemas Thor, Eu vou cozinhar um pouco do Ensopado Fedorento pra você!
