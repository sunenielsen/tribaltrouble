header=Lumumgumphe
description=O navio não pode cruzar através do recife com o Chefe Fjorleif e seus homens meio acima do peso a bordo. Ao invés disso, eles terão que atravessar a ilha à pé enquanto seu imediato navega o navio através do recife.
header0=Chief Fjorleif
dialog0=Tomem cuidado, homens! Essa ilha está lotada de indígenas hostis, então nós temos que ter atenção com nossos passos. Precisamos chegar a esse ponto de encontro no outro lado da ilha.
header1=Ponto de enconto alcançado
dialog1=Você alcançou o ponto de encontro. Sinalize tocando o Toque Aterrorizante com a sua lura para seu navio vir pegar você.
header2=Steingrim Esmagador de Crânios
dialog2=Salve! Nosso navio naufragou nos recifes, então nós estivemos encalhados aqui por um tempo. Nós nos escondemos dos indígenas ficando nesse vale, então você é mais que bem-vindo! Nós vamos se juntar a você com prazer, já que essa pode ser nossa única chance de saírmos.
