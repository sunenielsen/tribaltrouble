header=Var\u00F0ask\u00F3gur
description=Talvez essa seja a ilha secreta que Grimhildur Glutão falou sobre, quando ele disse que Fjorleif velejou para o oeste com as estátuas.
header0=Chefe Ngumba
dialog0=Morte e Diarreia, sem estátuas aqui também! Pelo menos parece que alguns de nossos compatriotas montaram um acampamento um pouco acima da costa.
header1=Chefe Gotoba
dialog1=Salve, Chefe Ngumba! Nós somos um grupo de antigos reféns que consiguiram escapar. Graças ao tamanho impressionante dessa ilha nós conseguimos nos esconder dos Vikings. Nós estamos montando um acampamento aqui para que possamos construir um návio e velejar pra casa.
header2=Chefe Ngumba
dialog2=Que tal nós nos aliarmos e expulsarmos os Vikings pra fora dessa ilha então? Sem vikings para interfirir, eu tenho certeza que a sua construção do navio seria muito mais fácil.
header3=Chefe Gotoba
dialog3=Soa como um plano... hora bater em Vikings!
header4=Ngolongo Pés-ágeis
dialog4=Ei chefe, nós encontramos um mapa interessante nas ruínas. Ele mostra uma ilha que nós não conhecíamos, então eu desenhei ela em nosso mapa agora. Talvez seja lá onde Fjorleif está se escondendo?
game_over=Todos os aliados foram mortos. Fim de jogo.
