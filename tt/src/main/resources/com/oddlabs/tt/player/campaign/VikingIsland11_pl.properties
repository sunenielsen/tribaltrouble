header=Fufupogo
description=Jeden ze statk\u00F3w naszych rywali zosta\u0142 zauwa\u017Cony w pobli\u017Cu tej wyspy. By\u0107 mo\u017Ce dowiedzieli si\u0119 r\u00F3wnie\u017C o skarbie tubylc\u00F3w.
header0=W\u00F3dz Fjorleif
dialog0=O nie, m\u00F3j arcyrywal Egill Jajog\u0142owy podbi\u0142 t\u0119 wysp\u0119. Niew\u0105tpliwie te\u017C poluje na skarb tubylc\u00F3w. Ojej, chyba nas zauwa\u017Cy\u0142!
header1=Egill Egghead
dialog1=Fjorleif Fartpants, spotykamy si\u0119 ponownie!
header2=W\u00F3dz Fjorleif
dialog2=*Narzekanie* ... Nie nazywaj mnie pe\u0142nym imieniem, kiedy m\u0119\u017Cczy\u017Ani je us\u0142ysz\u0105!
header3=Egill Egghead
dialog3=Ot\u00F3\u017C, jestem tu, aby poinformowa\u0107, \u017Ce ta grupa wysp jest teraz w\u0142asno\u015Bci\u0105 Egghead Looting Enterprise i \u017Ce twoja obecno\u015B\u0107 wymaga uiszczenia op\u0142aty licencyjnej za grabie\u017C w wysoko\u015Bci jednej bary\u0142ki z\u0142ota dziennie. Czy zgadzasz si\u0119 na te warunki?
header4=W\u00F3dz Fjorleif
dialog4=Co?!? Przecie\u017C to my tu byli\u015Bmy pierwsi!
header5=Egill Egghead
dialog5=Oczywi\u015Bcie, \u017Ce nie. W takim razie uznam to za odmow\u0119. Moi wojownicy dopilnuj\u0105, \u017Ceby\u015B zosta\u0142 wyrzucony z tej wyspy w brutalny i generalnie nieprzyjemny spos\u00F3b. Mi\u0142ego dnia!
header6=W\u00F3dz Fjorleif
dialog6=Ten dra\u0144... nie ujdzie mu to na sucho!
header7=Petur Peon
dialog7=Pierdo\u0142y, co?
header8=W\u00F3dz Fjorleif
dialog8=Zamknij si\u0119 i walcz!
name2=Jajog\u0142owi
objective=Zniszcz Jajog\u0142owych.
