header=Togongolum
description=Wed\u0142ug miejscowych plotek, na tej wyspie mieszka bardzo stary i m\u0105dry w\u00F3dz. Mo\u017Ce je\u015Bli go z\u0142apiemy, b\u0119dzie m\u00F3g\u0142 nam zdradzi\u0107 jakie\u015B przydatne informacje.
