header1=W\u00F3dz Mozumba
dialog1=Prosz\u0119, nie r\u00F3b mi krzywdy! Powiem ci, co wiem... Daleko na po\u0142udniowy wsch\u00F3d st\u0105d le\u017Cy wyspa, kt\u00F3rej nie znajdziesz na mapie. Je\u015Bli uda ci si\u0119 wspi\u0105\u0107 na jej g\u00F3r\u0119, wielki b\u00F3g piorun\u00F3w Xarrr spe\u0142ni twoje \u017Cyczenie, oczywi\u015Bcie pod warunkiem, \u017Ce grzecznie poprosisz.
game_over=Wrogi w\u00F3dz zosta\u0142 zabity. Koniec gry.
