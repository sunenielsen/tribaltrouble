header=Dyngjaskagi
description=Gunnar wspomina\u0142 co\u015B o pot\u0119\u017Cnym i pot\u0119\u017Cnym bogu piorun\u00F3w, kt\u00F3ry kr\u0105\u017Cy po tej wyspie. C\u00F3\u017C, nie ma mowy, \u017Ceby by\u0142 nawet w po\u0142owie tak pot\u0119\u017Cny jak Pot\u0119\u017Cny Xarrr, ale wci\u0105\u017C m\u00F3g\u0142by pom\u00F3c w walce z chwiejnym Trzeszcz\u0105cym Ob\u0142okiem.
header0=W\u00F3dz Ngumba
dialog0=To nasz cel \u2013 czas na ma\u0142y piknik. Lepiej si\u0119 pospieszmy, bo Wikingowie chyba te\u017C ju\u017C nadchodz\u0105. A, i nie zbli\u017Cajcie si\u0119 za bardzo do tych wie\u017C.
header1=Thor
dialog1=Kto \u015Bmie wkroczy\u0107 na m\u00F3j p\u00F3\u0142wysep?!?
header2=W\u00F3dz Ngumba
dialog2=W\u00F3dz Ngumba i jego nieustraszeni wojownicy!
header3=Thor
dialog3=Ty bezczelny, malutki robaczku! Po\u017Ca\u0142ujesz tego!
header4=W\u00F3dz Ngumba
dialog4=Aiieeh, Wielki Xarrr, chro\u0144 nas!
header5=Thor
dialog5=Xarrr? Znasz go? To jeden z moich starych kumpli z God Academy. Fajny go\u015B\u0107!
header6=W\u00F3dz Ngumba
dialog6=Eee, jasne. Nauczy\u0142 mnie kontrolowa\u0107 pogod\u0119, \u017Cebym m\u00F3g\u0142 razi\u0107 wrog\u00F3w w\u015Bciek\u0142ymi piorunami. Ale jako\u015B to nie dzia\u0142a w tym zimnym klimacie.
header7=Thor
dialog7=W takim razie musia\u0142 ci\u0119 te\u017C nauczy\u0107 robi\u0107 ten pyszny, cuchn\u0105cy gulasz, kt\u00F3ry gotowa\u0142 za dawnych dobrych czas\u00F3w. Uwielbiam egzotyczne jedzenie, ale moja \u017Cona zawsze serwuje t\u0119 sam\u0105 nudn\u0105 mielon\u0105 wieprzowin\u0119 i kaszank\u0119. Ugotuj mi gulasz, a pomog\u0119 ci z twoim problemem z piorunami!
header8=W\u00F3dz Ngumba
dialog8=Nie ma problemu Thor, ugotuj\u0119 ci \u015Bmierdz\u0105cy gulasz!
name2=Gwardia
name4=Wikingowie
god=Thor
objective0=Id\u017A do Thora.
