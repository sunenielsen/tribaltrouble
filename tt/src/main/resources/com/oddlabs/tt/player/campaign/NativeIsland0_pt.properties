header0=Chefe Ngumba
dialog0=Esses malditos Vikings n\u00E3o v\u00E3o parar at\u00E9 eles terem cada uma de nossas est\u00E1tuas sagradas. Parece que eles est\u00E3o vindo pra c\u00E1 agora!
header1=Chefe Ngumba
dialog1=Por mais ferozes que n\u00F3s somos, Eu n\u00E3o acho que temos uma chance contra esse ex\u00E9rcito. Melhor eu voltar pra praia e ... \u00E9\u00E9 ... arrumar alguns refor\u00E7os. Aguentem enquanto eu estiver fora!
header2=Chefe Ngumba
dialog2=Sauda\u00E7\u00F5es, homens! Eu realmente preciso de sua ajuda agora mesmo.
header3=Nufungu O N\u00E3o-t\u00E3o-feroz
dialog3=Tarde de mais, aquele Fjorleif j\u00E1 saqueou a \u00FAltima de nossas est\u00E1tuas e velejou. Ele at\u00E9 levou algumas galinhas tropicais com ele! Por\u00E9m toda a esperan\u00E7a n\u00E3o est\u00E1 perdida, eu acabei de receber a noticia de que seu primo tolo Gunnar foi avistado no outro lado dessa ilha.
header4=Chefe Ngumba
dialog4=N\u00E3o temos tempo pra desperdi\u00E7ar ent\u00E3o, vamos capturar e interrogar Gunnar. Se algu\u00E9m sabe onde Fjorleif est\u00E1 indo esse seria ele.
header5=Chefe Gunnar O Ing\u00EAnuo
dialog5=OK, Eu me rendo! Eu vou deixar suas est\u00E1tuas e velejar pra casa.
header6=Chefe Ngumba
dialog6=Seu primo Fjorleif j\u00E1 roubou a \u00FAltima delas, seu tolo! E a menos que queira que a gente te esprema dentro dessa corneta de metal, voc\u00EA vai nos dizer onde podemos achar Fjorleif e nossas preciosas est\u00E1tuas.
header7=Chefe Gunnar O Ing\u00EAnuo
dialog7=Ouwww, minha lura n\u00E3o! Eu vou ajudar voc\u00EA a desenhar um mapa de nossas ilhas ent\u00E3o.
