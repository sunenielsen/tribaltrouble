header=Lumumgumphe
description=Statek nie mo\u017Ce przep\u0142yn\u0105\u0107 przez raf\u0119 z wodzem Fjorleifem i jego nieco oty\u0142ymi lud\u017Ami na pok\u0142adzie. Zamiast tego b\u0119d\u0105 musieli przej\u015B\u0107 przez wysp\u0119 pieszo, podczas gdy pierwszy oficer b\u0119dzie nawigowa\u0142 statkiem przez raf\u0119.
header0=W\u00F3dz Fjorleif
dialog0=Uwa\u017Cajcie, panowie! Ta wyspa jest pe\u0142na wrogich tubylc\u00F3w, wi\u0119c musimy uwa\u017Ca\u0107. Musimy dotrze\u0107 do tego punktu zbornego po drugiej stronie wyspy.
header1=Dotarto do punktu zbi\u00F3rki
dialog1=Dotar\u0142e\u015B do punktu zbi\u00F3rki. Daj sygna\u0142 swojemu statkowi, \u017Ceby podp\u0142yn\u0105\u0142 i ci\u0119 zabra\u0142, wydaj\u0105c przera\u017Caj\u0105cy toot swoim lurem.
header2=Steingrim Rozbijacz Czaszek
dialog2=Witaj! Nasz statek rozbi\u0142 si\u0119 na rafach, wi\u0119c utkn\u0119li\u015Bmy tu na jaki\u015B czas. Ukryli\u015Bmy si\u0119 przed tubylcami, pozostaj\u0105c w tej dolinie, wi\u0119c jeste\u015B mile widziany! Z przyjemno\u015Bci\u0105 do\u0142\u0105czymy do ciebie, bo to mo\u017Ce by\u0107 nasza jedyna szansa na ucieczk\u0119.
name1=Na mieli\u017Anie
name2=Tubylcy
objective0=Dotrzyj do punktu zbi\u00F3rki.
objective1=Zr\u00F3b przera\u017Caj\u0105cy toot w pobli\u017Cu miejsca zbi\u00F3rki.
