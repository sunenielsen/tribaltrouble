header=Var\u00F0ask\u00F3gur
description=By\u0107 mo\u017Ce to jest owa tajemnicza wyspa, o kt\u00F3rej m\u00F3wi\u0142 Grimhildur Guzzlegut, gdy twierdzi\u0142, \u017Ce Fjorleif pop\u0142yn\u0105\u0142 na zach\u00F3d z pos\u0105gami.
header0=W\u00F3dz Ngumba
dialog0=\u015Amier\u0107 i Biegunka, tu te\u017C nie ma pos\u0105g\u00F3w! Przynajmniej wygl\u0105da na to, \u017Ce niekt\u00F3rzy z naszych rodak\u00F3w rozbili ob\u00F3z nieco dalej na wybrze\u017Cu.
header1=W\u00F3dz Gotoba
dialog1=B\u0105d\u017A pozdrowiony, wodzu Ngumba! Jeste\u015Bmy grup\u0105 by\u0142ych niewolnik\u00F3w, kt\u00F3rzy uciekli. Dzi\u0119ki ogromowi tej wyspy uda\u0142o nam si\u0119 ukry\u0107 przed wikingami. Rozbijamy tu ob\u00F3z, \u017Ceby zbudowa\u0107 statek i pop\u0142yn\u0105\u0107 do domu.
header2=W\u00F3dz Ngumba
dialog2=A mo\u017Ce po\u0142\u0105czymy si\u0142y i wyp\u0119dzimy Wiking\u00F3w z tej wyspy? Bez wiking\u00F3w, kt\u00F3re mog\u0142yby nam przeszkodzi\u0107, jestem pewien, \u017Ce tw\u00F3j biznes szkutniczy by\u0142by o wiele \u0142atwiejszy.
header3=W\u00F3dz Gotoba
dialog3=Brzmi jak plan... czas na troch\u0119 krytyki Wiking\u00F3w!
header4=Ngolongo Nimblefeet
dialog4=Hej, szefie, znale\u017Ali\u015Bmy ciekaw\u0105 map\u0119 w ruinach. Pokazuje wysp\u0119, o kt\u00F3rej nie wiedzieli\u015Bmy, wi\u0119c narysowa\u0142em j\u0105 teraz na naszej mapie. Mo\u017Ce tam ukrywa si\u0119 Fjorleif?
game_over=Wszyscy sojusznicy zgin\u0119li. Koniec gry.
