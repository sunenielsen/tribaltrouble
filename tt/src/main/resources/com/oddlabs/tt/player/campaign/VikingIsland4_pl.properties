header=Gobazumbi
description=W wodach w pobli\u017Cu tej wyspy zauwa\u017Cono szcz\u0105tki statku wiking\u00F3w. By\u0107 mo\u017Ce s\u0105 inni dzielni wikingowie, kt\u00F3rzy podzielili ten sam los co my.
header0=W\u00F3dz Fjorleif
dialog0=Okaza\u0142o si\u0119, \u017Ce wrak statku nale\u017Ca\u0142 do mojego kuzyna Gunnara Naiwnego, kt\u00F3ry jest teraz przetrzymywany w niewoli przez tubylc\u00F3w. Pom\u00F3\u017Cmy mu!
header1=W\u00F3dz Gunnar
dialog1=Dzi\u0119ki za uwolnienie! Mo\u017Ce powinienem by\u0142 pos\u0142ucha\u0107 moich ludzi, ale by\u0142em pewien, \u017Ce tubylcy zaprosz\u0105 nas wszystkich na kolacj\u0119. Uda\u0142o mi si\u0119 jednak troch\u0119 podszkoli\u0107 moje umiej\u0119tno\u015Bci w pos\u0142ugiwaniu si\u0119 lurem. Pozw\u00F3l, \u017Ce naucz\u0119 ci\u0119, jak wykona\u0107 Przera\u017Caj\u0105cy Toot, kt\u00F3ry mo\u017Ce na chwil\u0119 og\u0142uszy\u0107 twoich wrog\u00F3w.
game_over=W\u00F3dz Gunnar zosta\u0142 zabity. Koniec gry.
name1=Gunnar
name2=Tubylcy
objective=Zniszcz tubylc\u00F3w.\nUratuj Gunnara.
