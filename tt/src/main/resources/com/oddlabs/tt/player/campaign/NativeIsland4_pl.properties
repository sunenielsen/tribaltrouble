dialog0=Witaj, wodzu, wiedzieli\u015Bmy, \u017Ce przyjdziesz nam z pomoc\u0105! Uda\u0142o nam si\u0119 uciec z obozu jenieckiego, ale ukrywali\u015Bmy si\u0119 tu od kilku dni bez wody i jedzenia... Obawiam si\u0119, \u017Ce jeste\u015Bmy w kiepskim stanie, wi\u0119c nie mo\u017Cemy pom\u00F3c ci w walce z Wikingami.
header1=W\u00F3dz Ngumba
dialog1=Nie martw si\u0119, ochronimy ci\u0119, ale mamy ma\u0142y problem: nasz statek uderzy\u0142 w raf\u0119 i nabiera wody, wi\u0119c musimy go naprawi\u0107. Je\u015Bli uda nam si\u0119 wytrzyma\u0107 troch\u0119, mo\u017Cemy opu\u015Bci\u0107 t\u0119 wysp\u0119 i zabra\u0107 ci\u0119 ze sob\u0105.
