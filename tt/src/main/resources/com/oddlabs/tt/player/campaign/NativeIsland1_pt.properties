description=A ilha de Gunnar. Ele nos disse que alguns de nossos parentes foram levados como prisioneiros, então talvez alguns deles podem ter terminado aqui. Se eles tiverem, nós precisamos libertar eles agora mesmo!
header0=Zimfubo O Zeloso
dialog0=Olhe chefe! Gunnar estava certo, eles levaram alguns de nossos parentes com eles, provavelmente para usar eles como reféns. Mostre a eles a sua fúria e libere a Núvem Crepitante
header1=Chefe Ngumba
dialog1=Maldição! Não consigo fazê-la funcionar nesse clima frio. Ou talvez nós estamos apenas muito longe do domínio de O Grande Xarrr. Parece que vamos ter que fazer isso da maneira antiga... vamos lá!
header2=Chefe Ngumba
dialog2=Vocês estão livres agora pequenos companheiros, chega de trabalhar para os Vikings!\n\nBem, não fiquem aí parados - voltem ao trabalho e construam-me uma vila para que assim podemos criar um exército enorme e derrotarmos aqueles Vikings!
