header=Guzumbabwe
description=Na tej wyspie zauwa\u017Cyli\u015Bmy mn\u00F3stwo kolorowych kurczak\u00F3w. Mo\u017Ce tubylcy hoduj\u0105 je w jakim\u015B z\u0142owrogim celu?
header0=W\u00F3dz Fjorleif
dialog0=Nasi zwiadowcy donosz\u0105, \u017Ce tubylcy najwyra\u017Aniej u\u017Cywaj\u0105 kurczak\u00F3w do konstruowania specjalnej broni. Musimy ich pokona\u0107 i pozna\u0107 ich sekret!
header1=W\u00F3dz Fjorleif
dialog1=Ich sekret polega\u0142 na wykorzystaniu dziob\u00F3w kurczak\u00F3w jako grot\u00F3w w\u0142\u00F3czni. Zaprojektowa\u0142em top\u00F3r w ten sam spos\u00F3b, dzi\u0119ki czemu mo\u017Cemy teraz wyposa\u017Cy\u0107 straszliwych kurczak\u00F3w-wojownik\u00F3w.
name2=Tubylcy
objective=Zniszcz tubylc\u00F3w.
