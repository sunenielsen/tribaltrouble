header=Gobazumbi
description=Os restos de um navio Viking foram avistados nas águas perto dessa ilha. Talvez existem outros valentes Vikings que sofreram o mesmo destino de nós.
header0=Chefe Fjorleif
dialog0=O naufrágio acabou que pertencia ao meu primo Gunnar o Ingênuo, que está sendo mantido cativo pelos indígenas agora. Vamos ajudar ele!
header1=Chefe Gunnar
dialog1=Obrigado por me libertar! Talvez eu devia ter escutado aos meus homens, mas eu estava certo de que os indígenas iriam convidar todos nós pra jantar. Porém eu ainda consegui praticar minhas habilidades com a lura um pouco, Deixe-me te ensinar a como tocar o Toque Aterrorizante, que pode atordoar seus inimigos por um breve tempo.
game_over=Chefe Gunnar foi morto. Fim de jogo.
