header=Fufupogo
description=Um dos navios de nossos rivais foi avistado próximo dessa ilha. Takvez ekes descobriram sobre o tesouro dos indígenas também.
header0=Chefe Fjorleif
dialog0=Ah não, meu arqui-rival Egill Cabeça de Ovo conquistou essa ilha. Sem sombra de dúvidas ele está atrás do tesouro dos indígenas também. Credo, Eu acho que ele nos viu!
header1=Egill Cabeça de Ovo
dialog1=Fjorleif Peidorreiro, nos encontramos de novo!
header2=Chefe Fjorleif
dialog2=*Resmunga* ... Não me chame pelo meu nome completo enquanto meus homens estiverem escutando!
header3=Egill Cabeça de Ovo
dialog3=Bem, Estou aqui para te informar que esse grupo de ilhas agora é propriedade da Companhia de Saqueamento Cabeça de Ovo, e que sua presença requer que você pague uma Taxa de licença de saqueamento de um barril de ouro por dia. Você concorda com esses termos?
header4=Chefe Fjorleif
dialog4=O quê?!? Mas nós chegamos aqui primeiro!
header5=Egill Cabeça de Ovo
dialog5=Obviamente não. Eu vou entender isso como um não então. Meus guerreiros verão como é expulso desta ilha com violentas e em geral desagradáveis maneiras. Bom dia!
header6=Chefe Fjorleif
dialog6=Aquele bastardo... ele não se safará com isso!
header7=Petur O Peão
dialog7=Peidorreiro, hein?
header8=Chefe Fjorleif
dialog8=Apenas cale a boca e lute!
