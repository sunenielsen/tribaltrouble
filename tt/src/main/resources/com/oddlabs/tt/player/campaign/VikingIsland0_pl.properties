header0=Petur Peon
dialog0=Ojej, co za katastrofa! Nie do\u015B\u0107, \u017Ce znowu za du\u017Co wypili\u015Bmy, to jeszcze rozp\u0119ta\u0142a si\u0119 w nas szalej\u0105ca burza, kt\u00F3ra trwa\u0142a kilka dni. Mo\u017Cna si\u0119 tylko zastanawia\u0107, gdzie si\u0119 znale\u017Ali\u015Bmy. Po\u0142owa za\u0142ogi zagin\u0119\u0142a, a w\u00F3dz Fjorleif wypad\u0142 za burt\u0119 gdzie\u015B w pobli\u017Cu tej wyspy. My\u015Bl\u0119, \u017Ce jest przetrzymywany przez tubylc\u00F3w... musimy go uwolni\u0107!
header1=W\u00F3dz Fjorleif
dialog1=Dobra robota, panowie! Podczas gdy by\u0142em przetrzymywany przez tubylc\u00F3w, uda\u0142o mi si\u0119 skopiowa\u0107 jedn\u0105 z ich map. My\u015Bl\u0119, \u017Ce maj\u0105 ukryty jaki\u015B skarb na wi\u0119kszych wyspach. Stracili\u015Bmy ca\u0142y \u0142up podczas burzy i nie \u015Bmiem sobie wyobrazi\u0107, co zrobi\u0142yby nam nasze \u017Cony, gdyby\u015Bmy wr\u00F3cili z pustymi r\u0119kami z tej wyprawy, wi\u0119c do dzie\u0142a!
game_over=W\u00F3dz Fjorleif zosta\u0142 zabity. Koniec gry.
name1=Fjorleif
name2=Tubylcy
objective=Zniszcz tubylc\u00F3w.\nUratuj wodza.
