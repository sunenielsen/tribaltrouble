header=Togongolum
description=De acordo com a fofoca indígena, essa ilha hospeda um chefe bem velho e sábio. Talvez ele pode compartilhar alguma informação se nós o pegarmos.
header0=Chefe Fjorleif
dialog0=Como esperado, o chefe está bem protegido. Elimine seus guerreiros e capture-o pra interrogação.
