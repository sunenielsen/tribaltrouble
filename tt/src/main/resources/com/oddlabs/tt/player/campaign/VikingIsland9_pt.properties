dialog1=Por favor não me machuque! Eu vou te contar o que eu sei.. Bem ao sudeste daqui, há uma ilha que você não vai encontrar em seu mapa. se você conseguir escalar sua montanha, o grande deus do trovão Xarrr vai te conceder um desejo, se você pedir pra ele de forma gentil, claro.
game_over=Chefe inimigo foi morto. Fim de jogo.
