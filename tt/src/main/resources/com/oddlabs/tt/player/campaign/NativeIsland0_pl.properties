header0=W\u00F3dz Ngumba
dialog0=Przekl\u0119ci Wikingowie nie spoczn\u0105, dop\u00F3ki nie zdob\u0119d\u0105 wszystkich naszych \u015Bwi\u0119tych pos\u0105g\u00F3w. Wygl\u0105da na to, \u017Ce ju\u017C tu id\u0105!
header1=W\u00F3dz Ngumba
dialog1=Niewa\u017Cne, czy gro\u017Ani, czy nie, nie s\u0105dz\u0119, \u017Ceby\u015Bmy mieli szans\u0119 z t\u0105 armi\u0105. Lepiej p\u00F3jd\u0119 tylnym wyj\u015Bciem na pla\u017C\u0119 i... eee... zorganizuj\u0119 wsparcie. Wytrzymajcie, dop\u00F3ki nie wr\u00F3c\u0119!
header2=W\u00F3dz Ngumba
dialog2=Witajcie, panowie! Naprawd\u0119 przyda\u0142aby mi si\u0119 teraz wasza pomoc.
header3=Nufungu Niezbyt gro\u017Any
dialog3=Za p\u00F3\u017Ano, ten ca\u0142y Fjorleif zrabowa\u0142 ju\u017C ostatni\u0105 z naszych statuetek i odp\u0142yn\u0105\u0142. Zabra\u0142 ze sob\u0105 nawet kilka tropikalnych kurczak\u00F3w! Nie wszystko jednak stracone, w\u0142a\u015Bnie dosta\u0142em wiadomo\u015B\u0107, \u017Ce jego g\u0142upkowaty kuzyn Gunnar zosta\u0142 dostrze\u017Cony po drugiej stronie wyspy.
header4=W\u00F3dz Ngumba
dialog4=Nie ma wi\u0119c czasu do stracenia, schwytajmy Gunnara i przes\u0142uchajmy go. Je\u015Bli ktokolwiek wie, dok\u0105d zmierza Fjorleif, to w\u0142a\u015Bnie on.
header5=W\u00F3dz Gunnar \u0141atwowierny
dialog5=Dobra, rozumiem, poddaj\u0119 si\u0119! Zostawi\u0119 wasze statuetki i odp\u0142ywam do domu.
header6=W\u00F3dz Ngumba
dialog6=Tw\u00F3j kuzyn Fjorleif ukrad\u0142 ju\u017C ostatniego z nich, g\u0142upcze! I je\u015Bli nie chcesz, \u017Ceby\u015Bmy ci\u0119 przecisn\u0119li przez ten mosi\u0119\u017Cny r\u00F3g, to powiesz nam, gdzie znajdziemy Fjorleifa i nasze cenne statuetki.
header7=W\u00F3dz Gunnar \u0141atwowierny
dialog7=Auuu, tylko nie m\u00F3j r\u00F3g! W takim razie pomog\u0119 wam sporz\u0105dzi\u0107 map\u0119 naszych wysp.
