header0=Petur o peão
dialog0=Ah minha nossa, que disastre! Não apenas bebemos muito novamente, como também fomos atingidos por uma tempestade furiosa que durou por dias. Só resta imaginar onde acabamos. Metade da tripulação está desaparecida e o Chefe Fjorleif desembarcou perto desta ilha. Eu acho que ele está sendo mantido cativo pelos indígenas... temos que libertá-lo!
header1=Chefe Fjorleif
dialog1=Bom trabalho, homens! Enquanto estive sendo mantido cativo pelos indígenas, Eu consegui copiar um de seus mapas. Eu acho que eles possuem algum tesouro escondido nas ilhas maiores. Nós perdemos todo nosso saque na tempestade e eu não quero nem imaginar o que nossas esposas iriam fazer com a gente se voltarmos de mãos vazias dessa viagem, então vamos ao trabalho!
game_over=Chefe Fjorleif foi morto. Fim de jogo.
