description=Wyspa Gunnara. Powiedzia\u0142 nam, \u017Ce niekt\u00F3rzy z naszych krewnych zostali pojmani jako niewolnicy, wi\u0119c mo\u017Ce niekt\u00F3rzy z nich trafili tutaj. Je\u015Bli tak, musimy ich natychmiast uwolni\u0107!
header0=Zimfubo Gorliwy
dialog0=Patrz, wodzu! Gunnar mia\u0142 racj\u0119, zabrali ze sob\u0105 kilku naszych krewnych, prawdopodobnie po to, by wykorzysta\u0107 ich jako niewolnik\u00F3w. Poka\u017C im sw\u00F3j gniew i uwolnij Trzeszcz\u0105c\u0105 Chmur\u0119!
header1=W\u00F3dz Ngumba
dialog1=Cholera! Nie dam rady w tym zimnym klimacie. A mo\u017Ce po prostu jeste\u015Bmy za daleko od domeny Wielkiego Xarrr. Wygl\u0105da na to, \u017Ce b\u0119dziemy musieli zrobi\u0107 to po staremu... chod\u017Amy!
header2=W\u00F3dz Ngumba
